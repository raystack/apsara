name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches a lucide export name that no longer exists — for example after
      # the lucide-react peer range moves.
      - name: Check the icon map
        run: pnpm --filter=@raystack/apsara check:icon-map

      # icons/generated/ is not in git. The `prepare` script already wrote it
      # during install; running it again here keeps the dependency explicit and
      # fails on this step rather than inside the test or build step.
      - name: Generate the icon registry
        run: pnpm --filter=@raystack/apsara build:icon-registry

      - name: Run tests
        run: pnpm --filter=@raystack/apsara test

      - name: Check build
        run: pnpm build:apsara
